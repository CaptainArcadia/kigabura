<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キガブラ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" id="css">
<script>document.getElementById('css').href = 'style.css?v=' + Date.now();</script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- 試合中HUD -->
<div id="hud" class="hidden">
  <div id="tags"></div>
  <div id="bubbles"></div>
  <div id="timer"></div>
  <div id="stagename"><small>STAGE</small><span></span></div>
  <div id="cards"></div>
  <div id="centermsg"></div>
  <div id="flash"></div>
</div>

<!-- 各画面は ui.js が組み立てる -->
<div id="screens"></div>

<div id="loading">
  <div class="load-logo">キガブラ</div>
  <div class="load-bar"><i></i></div>
  <div class="load-text">よみこみ中…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
// three.js をモジュールで読み込み、ゲーム本体（通常スクリプト）から使えるよう window に公開する。
// こうすることで index.html をダブルクリックで直接開いても動く（ローカルのモジュール読み込み制限を回避）。
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.THREE = THREE;
window.THREE_ADDONS = { EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment };

const files = [
  'src/core.js', 'src/audio.js', 'src/tex.js', 'src/models.js', 'src/anim.js',
  'src/moves.js', 'src/effects.js', 'src/fighter.js', 'src/stages.js', 'src/ai.js',
  'src/hud.js', 'src/game.js', 'src/ui.js', 'src/main.js'
];
const bar = document.querySelector('#loading .load-bar i');
for (let i = 0; i < files.length; i++) {
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = files[i] + '?v=' + Date.now(); // 古いキャッシュを読まないように
    s.onload = res;
    s.onerror = () => rej(new Error('読み込み失敗: ' + files[i]));
    document.body.appendChild(s);
  });
  bar.style.width = ((i + 1) / files.length * 70) + '%';
}
KB.boot();
</script>
</body>
</html>
